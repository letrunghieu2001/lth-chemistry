        if (og) og.content = og.content.replace(/\d+\+?\s*năm kinh nghiệm/, y + '+ năm kinh nghiệm');
        // Update Twitter description

        if (tw) tw.content = tw.content.replace(/\d+\+?\s*năm kinh nghiệm/, y + '+ năm kinh nghiệm');

        document.querySelectorAll('script[type="application/ld+json"]').forEach(function(s) {
          s.textContent = s.textContent.replace(/hơn \d+ năm/g, 'hơn ' + y + ' năm');
