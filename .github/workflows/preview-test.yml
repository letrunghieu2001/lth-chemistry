name: Preview Test (Nano Banana)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: automation/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Download Vietnamese font
        run: |
          mkdir -p automation/fonts
          curl -sL -o automation/fonts/BeVietnamPro-Regular.ttf \
            "https://github.com/google/fonts/raw/main/ofl/bevietnampro/BeVietnamPro-Regular.ttf"
          curl -sL -o automation/fonts/BeVietnamPro-Bold.ttf \
            "https://github.com/google/fonts/raw/main/ofl/bevietnampro/BeVietnamPro-Bold.ttf"

      - name: Generate preview
        working-directory: automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python test_preview.py

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: facebook-preview
          path: |
            automation/output/facebook_preview.html
            automation/output/preview_*.png
          retention-days: 7
