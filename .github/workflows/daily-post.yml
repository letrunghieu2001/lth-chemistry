name: Daily Facebook Post

on:
  schedule:
    # Run at 22:30 UTC = 05:30 AM Vietnam time (UTC+7)
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no Facebook posting)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: automation/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Download Vietnamese font
        run: |
          mkdir -p automation/fonts
          curl -sL -o automation/fonts/BeVietnamPro-Regular.ttf \
            "https://github.com/google/fonts/raw/main/ofl/bevietnampro/BeVietnamPro-Regular.ttf"
          curl -sL -o automation/fonts/BeVietnamPro-Bold.ttf \
            "https://github.com/google/fonts/raw/main/ofl/bevietnampro/BeVietnamPro-Bold.ttf"

      - name: Run daily post
        working-directory: automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python daily_post.py --dry-run --force
          else
            python daily_post.py
          fi

      - name: Upload generated images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-posts-${{ github.run_number }}
          path: automation/output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit state changes
        run: |
          git config user.name "LTH Chemistry Bot"
          git config user.email "bot@lthchemistry.com"
          git add automation/state.json
          git diff --staged --quiet || git commit -m "chore: update post state [skip ci]"
          git push
